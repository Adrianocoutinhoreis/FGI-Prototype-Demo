<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel - FGI</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .aluno-header-card {
            display: flex;
            align-items: center;
            gap: 18px;
            background: var(--color-bg-card);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        .aluno-avatar {
            font-size: 40px;
            background: var(--color-primary-light);
            border-radius: 50%;
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Abas */
        .aluno-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--color-border);
        }
        .aluno-tab {
            background: none;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 700;
            font-family: var(--font-family);
            color: var(--color-text-muted);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: color 0.15s;
        }
        .aluno-tab:hover { color: var(--color-primary); }
        .aluno-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }

        /* Filtro de matéria */
        .subject-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .subject-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 24px;
            border: 2px solid var(--color-border);
            background: #fff;
            font-weight: 700;
            font-size: 14px;
            font-family: var(--font-family);
            color: var(--color-text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }
        .subject-chip:hover { border-color: var(--color-primary); }
        .subject-chip.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }

        /* Cartão de jogo */
        .game-card {
            background: var(--color-bg-card);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .game-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--color-primary); }
        .game-card-icon {
            font-size: 36px;
            background: var(--color-bg-app);
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }
        .game-card-name { font-size: 20px; font-weight: 700; color: var(--color-text-main); }
        .game-card-stars { font-size: 18px; letter-spacing: 2px; }

        .empty-subject-card {
            grid-column: 1 / -1;
            border: 2px dashed var(--color-border);
            border-radius: var(--radius-lg);
            padding: 40px 24px;
            text-align: center;
            color: var(--color-text-muted);
            font-size: 16px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-text-main);
            margin: 0 0 14px;
        }

        /* Painel deslizante de JSON (igual ao usado na tela do professor) */
        .res-json-panel {
            display: none; position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 90vw;
            background: #1e1e2e; z-index: 500; padding: 20px; overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0,0,0,.25);
        }
        .res-json-panel.open { display: block; }
        .res-json-header { display: flex; justify-content: space-between; align-items: center; color: #c8d3f5; font-weight: 700; font-size: 14px; margin-bottom: 14px; }
        .res-json-close { background: none; border: none; color: #888; font-size: 18px; cursor: pointer; }
        .res-json-close:hover { color: #fff; }
        #res-json-content { font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6; color: #a9b8d8; white-space: pre-wrap; word-break: break-word; }
        .res-json-content .json-key { color: #86bbd8; }
        .res-json-content .json-str { color: #a9e79f; }
        .res-json-content .json-num { color: #fac75a; }
        .res-json-content .json-bool-true { color: #86bbd8; }
        .res-json-content .json-bool-false { color: #f0957a; }

        @media (max-width: 480px) {
            .res-json-panel { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <header class="app-header">
            <div class="logo-container">
                <span class="logo-emoji" aria-hidden="true">🧩</span>
                <span class="logo-text">FGI — Aluno</span>
            </div>
            <a href="../index.html" class="btn btn-secondary" style="min-height: 44px; padding: 8px 16px;">Sair</a>
        </header>

        <main>
            <div class="aluno-header-card">
                <div class="aluno-avatar" aria-hidden="true">🧒</div>
                <div>
                    <h1 class="app-title" style="text-align: left; margin-bottom: 0; font-size: 26px;">Olá, Lucas! 🧩</h1>
                </div>
            </div>

            <div class="aluno-tabs">
                <button type="button" class="aluno-tab active" data-tab="jogos">🎮 Jogos</button>
                <button type="button" class="aluno-tab" data-tab="progresso">🏆 Meu Progresso</button>
            </div>

            <!-- Aba: Jogos -->
            <section id="panel-jogos" class="aluno-tab-panel">
                <div class="section-title">📚 Jogos Disponíveis</div>
                <div class="subject-filter">
                    <button type="button" class="subject-chip active" data-subject="">Todas as matérias</button>
                    <button type="button" class="subject-chip" data-subject="matematica">➕ Matemática</button>
                    <button type="button" class="subject-chip" data-subject="portugues">🔤 Português</button>
                </div>
                <div class="grid-2" id="games-grid"></div>
            </section>

            <!-- Aba: Meu Progresso (oculta até o aluno clicar) -->
            <section id="panel-progresso" class="aluno-tab-panel" style="display: none;">
                <div class="section-title">🏆 Meu Progresso</div>
                <div class="metrics-container">
                    <div class="metric-row">
                        <span class="metric-label">Pontos acumulados</span>
                        <span class="metric-value">1.250 pts</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Medalhas conquistadas</span>
                        <span class="metric-value">🥇 🥈 🥉</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Sequência de acertos</span>
                        <span class="metric-value success">5 🔥</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Nível atual</span>
                        <span class="metric-value">Estudante</span>
                    </div>
                </div>

                <div class="btn-center" style="gap: 12px;">
                    <a href="progresso.html" class="btn btn-secondary">Ver meu progresso completo</a>
                    <button type="button" id="btn-ver-json" class="btn btn-secondary">{ } Ver JSON</button>
                </div>
            </section>
        </main>

    </div>

    <div class="res-json-panel" id="res-json-panel">
        <div class="res-json-header">
            <span>Meu Progresso (JSON)</span>
            <button type="button" class="res-json-close" id="res-json-close">✕</button>
        </div>
        <pre id="res-json-content" class="res-json-content"></pre>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // ── Jogos fictícios disponíveis, organizados por matéria ──
            var GAMES = [
                { subject: "matematica", icon: "➕", name: "Jogo da Soma", stars: 4, href: "tutorial.html" }
            ];
            var SUBJECT_EMPTY_MSG = {
                portugues: "🔤 Em breve! Novos jogos de Português estão a caminho."
            };

            function renderGames(subject) {
                var grid = document.getElementById("games-grid");
                var list = subject ? GAMES.filter(function (g) { return g.subject === subject; }) : GAMES;

                if (!list.length) {
                    var msg = SUBJECT_EMPTY_MSG[subject] || "Nenhum jogo disponível nesta matéria ainda.";
                    grid.innerHTML = '<div class="empty-subject-card">' + msg + "</div>";
                    return;
                }

                grid.innerHTML = list.map(function (g) {
                    return '<div class="game-card">' +
                        '<span class="game-card-icon" aria-hidden="true">' + g.icon + "</span>" +
                        '<span class="game-card-name">' + g.name + "</span>" +
                        '<span class="game-card-stars" aria-hidden="true">' + "⭐".repeat(g.stars) + "</span>" +
                        '<a href="' + g.href + '" class="btn btn-primary" style="margin-top: 8px;">Jogar</a>' +
                        "</div>";
                }).join("");
            }

            // Filtro de matéria
            document.querySelectorAll(".subject-chip").forEach(function (chip) {
                chip.addEventListener("click", function () {
                    document.querySelectorAll(".subject-chip").forEach(function (c) { c.classList.remove("active"); });
                    chip.classList.add("active");
                    renderGames(chip.getAttribute("data-subject"));
                });
            });

            // Abas: Jogos / Meu Progresso
            document.querySelectorAll(".aluno-tab").forEach(function (tab) {
                tab.addEventListener("click", function () {
                    document.querySelectorAll(".aluno-tab").forEach(function (t) { t.classList.remove("active"); });
                    tab.classList.add("active");
                    var alvo = tab.getAttribute("data-tab");
                    document.getElementById("panel-jogos").style.display = alvo === "jogos" ? "" : "none";
                    document.getElementById("panel-progresso").style.display = alvo === "progresso" ? "" : "none";
                });
            });

            renderGames("");

            // ── Painel "Ver JSON" do Meu Progresso ──
            function buildProgressOutput() {
                return {
                    aluno: "Lucas",
                    pontos: 1250,
                    medalhas: ["🥇", "🥈", "🥉"],
                    sequenciaAcertos: 5,
                    nivelAtual: "Estudante"
                };
            }

            function syntaxHL(json) {
                return json
                    .replace(/("[\w]+")\s*:/g, '<span class="json-key">$1</span>:')
                    .replace(/:\s*(".*?")/g, ': <span class="json-str">$1</span>')
                    .replace(/:\s*(\d+\.?\d*)/g, ': <span class="json-num">$1</span>')
                    .replace(/:\s*(true)/g, ': <span class="json-bool-true">$1</span>')
                    .replace(/:\s*(false)/g, ': <span class="json-bool-false">$1</span>');
            }

            document.getElementById("btn-ver-json").addEventListener("click", function () {
                document.getElementById("res-json-content").innerHTML = syntaxHL(JSON.stringify(buildProgressOutput(), null, 2));
                document.getElementById("res-json-panel").classList.add("open");
            });

            document.getElementById("res-json-close").addEventListener("click", function () {
                document.getElementById("res-json-panel").classList.remove("open");
            });
        });
    </script>
</body>
</html>
