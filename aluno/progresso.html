<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Progresso - FGI</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .badge-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .badge-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: var(--color-bg-app);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            min-width: 100px;
        }
        .badge-chip-icon { font-size: 32px; }
        .badge-chip-label { font-size: 13px; color: var(--color-text-muted); font-weight: 600; }
    </style>
</head>
<body>

    <div class="app-container">

        <header class="app-header">
            <div class="logo-container">
                <span class="logo-emoji" aria-hidden="true">🧩</span>
                <span class="logo-text">FGI — Aluno</span>
            </div>
            <a href="dashboard.html" class="btn btn-secondary" style="min-height: 44px; padding: 8px 16px;">← Voltar</a>
        </header>

        <main class="card">
            <h1 class="app-title" style="text-align: left; margin-bottom: 8px;">Meu Progresso</h1>
            <p class="app-subtitle" style="text-align: left; margin-bottom: 24px;">Veja tudo o que você já conquistou até aqui, Lucas!</p>

            <div class="badge-row">
                <div class="badge-chip">
                    <span class="badge-chip-icon" aria-hidden="true">🥇</span>
                    <span class="badge-chip-label">Ouro</span>
                </div>
                <div class="badge-chip">
                    <span class="badge-chip-icon" aria-hidden="true">🥈</span>
                    <span class="badge-chip-label">Prata</span>
                </div>
                <div class="badge-chip">
                    <span class="badge-chip-icon" aria-hidden="true">🥉</span>
                    <span class="badge-chip-label">Bronze</span>
                </div>
                <div class="badge-chip">
                    <span class="badge-chip-icon" aria-hidden="true">🔥</span>
                    <span class="badge-chip-label">5 seguidas</span>
                </div>
            </div>

            <div class="metrics-container">
                <div class="metric-row">
                    <span class="metric-label">Pontos acumulados</span>
                    <span class="metric-value">1.250 pts</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Jogos concluídos</span>
                    <span class="metric-value">3</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Melhor aproveitamento</span>
                    <span class="metric-value success">95%</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">Nível atual</span>
                    <span class="metric-value">Estudante</span>
                </div>
            </div>

            <div class="btn-center">
                <a href="dashboard.html" class="btn btn-primary">🎮 Voltar aos Jogos</a>
            </div>
        </main>

    </div>

    <script src="../js/app.js"></script>
</body>
</html>
