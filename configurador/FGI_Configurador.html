<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FGI — Configurador de Perfil</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue-h: #185FA5; --blue-m: #378ADD; --blue-l: #E6F1FB;
    --gray-d: #2C2C2A; --gray-m: #888780; --gray-l: #F1EFE8; --gray-b: #ffffff;
    --green-h: #0F6E56; --green-l: #E1F5EE;
    --amber-h: #854F0B; --amber-l: #FAEEDA;
    --red-h: #A32D2D; --red-l: #FCEBEB;
    --border: #D3D1C7; --radius: 8px; --font: 'Segoe UI', system-ui, sans-serif;
  }
  body { font-family: var(--font); background: #F4F2EB; color: var(--gray-d); font-size: 14px; min-height: 100vh; }

  /* ── TOP BAR ── */
  .topbar { background: var(--blue-h); color: #fff; padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 52px; position: sticky; top: 0; z-index: 100; }
  .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  .topbar-sub { font-size: 12px; opacity: .75; margin-left: 4px; }
  .topbar-spacer { flex: 1; }
  .btn { padding: 6px 16px; border-radius: var(--radius); border: 1.5px solid; font-size: 12px; font-weight: 600; cursor: pointer; transition: .12s; }
  .btn-outline { background: transparent; border-color: rgba(255,255,255,.5); color: #fff; }
  .btn-outline:hover { background: rgba(255,255,255,.12); }
  .btn-primary { background: #fff; border-color: #fff; color: var(--blue-h); }
  .btn-primary:hover { background: var(--blue-l); }
  .btn-danger { background: transparent; border-color: #fca5a5; color: #fca5a5; }
  .btn-danger:hover { background: rgba(252,165,165,.15); }

  /* ── STUDENT BAR ── */
  .student-bar { background: #fff; border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .sb-label { font-size: 12px; color: var(--gray-m); font-weight: 500; }
  .sb-select { padding: 6px 10px; border: 1.5px solid var(--border); border-radius: var(--radius); font-size: 13px; background: #fff; cursor: pointer; color: var(--gray-d); }
  .sb-select:focus { outline: none; border-color: var(--blue-m); }
  .profile-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .override-count { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--amber-l); color: var(--amber-h); font-weight: 600; }
  .override-count.none { background: var(--green-l); color: var(--green-h); }

  /* ── LAYOUT ── */
  .layout { display: flex; height: calc(100vh - 52px - 53px); }

  /* ── SIDEBAR ── */
  .sidebar { width: 200px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border); overflow-y: auto; padding: 8px 0; }
  .group-item { display: flex; align-items: center; gap: 8px; padding: 9px 16px; cursor: pointer; font-size: 12px; color: var(--gray-d); border-left: 3px solid transparent; transition: .1s; position: relative; }
  .group-item:hover { background: var(--gray-l); }
  .group-item.active { background: var(--blue-l); color: var(--blue-h); border-left-color: var(--blue-h); font-weight: 600; }
  .group-icon { font-size: 14px; flex-shrink: 0; }
  .group-dot { position: absolute; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--amber-h); display: none; }
  .group-dot.show { display: block; }

  /* ── MAIN ── */
  .main { flex: 1; overflow-y: auto; padding: 20px 28px; }
  .group-title { font-size: 16px; font-weight: 600; color: var(--blue-h); margin-bottom: 4px; }
  .group-desc { font-size: 12px; color: var(--gray-m); margin-bottom: 18px; }

  /* ── PARAM ROWS ── */
  .param-row { display: flex; align-items: center; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 4px; background: #fff; border: 1px solid var(--border); gap: 12px; transition: .1s; }
  .param-row:hover { border-color: var(--blue-m); }
  .param-row.overridden { border-color: #EF9F27; background: #fffbf2; }
  .param-info { flex: 1; min-width: 0; }
  .param-name { font-size: 12px; font-weight: 600; color: var(--gray-d); font-family: 'Courier New', monospace; }
  .param-desc { font-size: 11px; color: var(--gray-m); margin-top: 1px; }
  .param-control { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
  .param-preset { font-size: 10px; color: var(--gray-m); display: none; }
  .param-row.overridden .param-preset { display: block; }
  .override-badge { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 10px; background: var(--amber-l); color: var(--amber-h); display: none; }
  .param-row.overridden .override-badge { display: inline-block; }
  .reset-btn { font-size: 10px; color: var(--gray-m); background: none; border: none; cursor: pointer; padding: 2px 4px; display: none; }
  .reset-btn:hover { color: var(--red-h); }
  .param-row.overridden .reset-btn { display: block; }

  /* ── CONTROLS ── */
  .toggle { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: var(--border); border-radius: 22px; cursor: pointer; transition: .2s; }
  .toggle-slider::before { content:''; position:absolute; width:16px; height:16px; bottom:3px; left:3px; background:#fff; border-radius:50%; transition:.2s; }
  .toggle input:checked + .toggle-slider { background: var(--blue-m); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

  select.param-select { padding: 4px 8px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 12px; background: #fff; cursor: pointer; color: var(--gray-d); min-width: 110px; }
  select.param-select:focus { outline: none; border-color: var(--blue-m); }
  input.param-num { width: 70px; padding: 4px 8px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 12px; text-align: right; color: var(--gray-d); }
  input.param-num:focus { outline: none; border-color: var(--blue-m); }
  input[type=range].param-range { width: 100px; }

  /* ── JSON PANEL ── */
  .json-panel { display: none; position: fixed; right: 0; top: 52px; bottom: 0; width: 380px; background: #1E1E2E; border-left: 1px solid #444; padding: 16px; overflow-y: auto; z-index: 200; }
  .json-panel.open { display: block; }
  .json-panel-title { font-size: 13px; font-weight: 600; color: #C8D3F5; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .json-close { background: none; border: none; color: #888; font-size: 18px; cursor: pointer; }
  .json-close:hover { color: #fff; }
  pre.json-content { font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.6; color: #A9B8D8; white-space: pre-wrap; word-break: break-all; }
  .json-key { color: #86BBD8; }
  .json-str { color: #A9E79F; }
  .json-num { color: #FAC75A; }
  .json-bool-true { color: #86BBD8; }
  .json-bool-false { color: #F0957A; }

  /* ── FOOTER ── */
  .footer { background: #fff; border-top: 1px solid var(--border); padding: 8px 24px; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--gray-m); position: sticky; bottom: 0; }
  .footer-spacer { flex: 1; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">FGI</span>
  <span class="topbar-sub">Configurador de Perfil</span>
  <div class="topbar-spacer"></div>
  <button class="btn btn-outline" onclick="resetToPreset()">↺ Restaurar preset</button>
  <button class="btn btn-primary" onclick="toggleJSON()">{ } Ver JSON</button>
</div>

<div class="student-bar">
  <span class="sb-label">Aluno:</span>
  <select class="sb-select" id="student-sel">
    <option value="ana">Ana Lima</option>
    <option value="bruno">Bruno Melo</option>
    <option value="carla">Carla Souza</option>
    <option value="diego">Diego Reis</option>
  </select>
  <span class="sb-label">Perfil:</span>
  <select class="sb-select" id="profile-sel" onchange="loadPreset(this.value)">
    <option value="T">T — Típico</option>
    <option value="T1" selected>T1 — TEA Nível 1</option>
    <option value="T2">T2 — TEA Nível 2</option>
    <option value="T3">T3 — TEA Nível 3</option>
    <option value="TD">TD — TDAH</option>
    <option value="DX">DX — Dislexia</option>
    <option value="DC">DC — Discalculia</option>
    <option value="DI">DI — Def. Intelectual</option>
  </select>
  <span id="profile-badge" class="profile-badge" style="background:#EEEDFE;color:#3C3489">TEA Nível 1</span>
  <div class="topbar-spacer" style="flex:1"></div>
  <span id="override-count" class="override-count none">✓ Sem ajustes</span>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main-content"></main>
</div>

<div class="json-panel" id="json-panel">
  <div class="json-panel-title">
    <span>GameConfig JSON</span>
    <button class="json-close" onclick="toggleJSON()">✕</button>
  </div>
  <pre class="json-content" id="json-content"></pre>
</div>

<div class="footer">
  <span>FGI — Framework de Jogos Inclusivos</span>
  <span class="footer-spacer"></span>
  <button class="btn btn-outline" style="background:none;border-color:var(--border);color:var(--gray-m)" onclick="copyJSON()">⎘ Copiar JSON</button>
</div>

    {k:'inputMethod', label:'inputMethod', desc:'Método de entrada', type:'select', opts:['touch','mouse','both']},
  ]},
  { id:'gamification', icon:'🏆', label:'Gamificação', desc:'Pontuação, medalhas e modo de jogo.', params:[
    {k:'enabled', label:'enabled', desc:'Ativa gamificação', type:'bool'},
    {k:'showPoints', label:'showPoints', desc:'Exibe pontuação durante o jogo', type:'bool'},
    {k:'showMedals', label:'showMedals', desc:'Exibe medalhas conquistadas', type:'bool'},
    {k:'mode', label:'mode', desc:'Modo de interação', type:'select', opts:['individual','cooperative','competitive','mixed']},
  ]},
  { id:'ui', icon:'🖥', label:'Interface', desc:'Modo foco, tarefa única e velocidade.', params:[
    {k:'focusMode', label:'focusMode', desc:'Remove decorações e menus não essenciais', type:'bool'},
    {k:'singleTaskMode', label:'singleTaskMode', desc:'Um elemento de interação por vez', type:'bool'},
    {k:'predictableStructure', label:'predictableStructure', desc:'Layout fixo, sem surpresas visuais', type:'bool'},
    {k:'simplifiedText', label:'simplifiedText', desc:'Enunciados simplificados', type:'bool'},
    {k:'gameSpeed', label:'gameSpeed', desc:'Ritmo geral do jogo', type:'select', opts:['slow','normal','fast']},
    {k:'distractionReduction', label:'distractionReduction', desc:'Redução de elementos visuais secundários', type:'select', opts:['none','low','high']},
  ]},
];

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentProfile = 'T1';
let currentConfig = null;
let presetConfig = null;
let activeGroup = 'timer';

function deepCopy(obj) { return JSON.parse(JSON.stringify(obj)); }

function loadPreset(profile) {
  currentProfile = profile;
  presetConfig = deepCopy(PRESETS[profile]);
  currentConfig = deepCopy(PRESETS[profile]);
  const meta = PROFILE_META[profile];
  const badge = document.getElementById('profile-badge');
  badge.textContent = `${profile} — ${meta.label}`;
  badge.style.background = meta.bg;
  badge.style.color = meta.color;
  renderSidebar();
  renderGroup(activeGroup);
  updateOverrideCount();
  if(document.getElementById('json-panel').classList.contains('open')) updateJSON();
}

function getValue(groupId, paramK) {
  return currentConfig[groupId][paramK];
}

function setValue(groupId, paramK, val) {
  currentConfig[groupId][paramK] = val;
  updateParamRow(groupId, paramK);
  updateSidebarDot(groupId);
  updateOverrideCount();
  if(document.getElementById('json-panel').classList.contains('open')) updateJSON();
}

function isOverridden(groupId, paramK) {
  const preset = presetConfig[groupId][paramK];
  const cur = currentConfig[groupId][paramK];
  return String(preset) !== String(cur);
}

function groupHasOverride(groupId) {
  return GROUPS.find(g=>g.id===groupId).params.some(p => isOverridden(groupId, p.k));
}

function totalOverrides() {
  return GROUPS.reduce((n,g) => n + g.params.filter(p => isOverridden(g.id, p.k)).length, 0);
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = GROUPS.map(g => `
    <div class="group-item${g.id===activeGroup?' active':''}" onclick="selectGroup('${g.id}')">
      <span class="group-icon">${g.icon}</span>
      <span>${g.label}</span>
      <span class="group-dot${groupHasOverride(g.id)?' show':''}" id="dot-${g.id}"></span>
    </div>`).join('');
}

function updateSidebarDot(groupId) {
  const dot = document.getElementById(`dot-${groupId}`);
  if(dot) dot.className = `group-dot${groupHasOverride(groupId)?' show':''}`;
}

function selectGroup(groupId) {
  activeGroup = groupId;
  renderSidebar();
  renderGroup(groupId);
}

function renderGroup(groupId) {
  const group = GROUPS.find(g => g.id === groupId);
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="group-title">${group.icon} ${group.label}</div>
    <div class="group-desc">${group.desc}</div>
    ${group.params.map(p => renderParamRow(groupId, p)).join('')}
  `;
}

function renderParamRow(groupId, param) {
  const cur = getValue(groupId, param.k);
  const preset = presetConfig[groupId][param.k];
  const over = String(cur) !== String(preset);
  const control = renderControl(groupId, param, cur);
  return `
    <div class="param-row${over?' overridden':''}" id="row-${groupId}-${param.k}">
      <div class="param-info">
        <div class="param-name">${param.label} <span class="override-badge">ajustado</span></div>
        <div class="param-desc">${param.desc}</div>
        <div class="param-preset">padrão: <b>${preset}</b></div>
      </div>
      <div class="param-control">
        ${control}
        <button class="reset-btn" onclick="resetParam('${groupId}','${param.k}')" title="Restaurar padrão">↺</button>
      </div>
    </div>`;
}

function renderControl(groupId, param, cur) {
  const id = `ctrl-${groupId}-${param.k}`;
  if(param.type === 'bool') {
    return `<label class="toggle">
      <input type="checkbox" id="${id}" ${cur?'checked':''} onchange="setValue('${groupId}','${param.k}',this.checked)">
      <span class="toggle-slider"></span>
    </label>`;
  }
  if(param.type === 'select') {
    const opts = param.opts.map(o => `<option value="${o}"${String(cur)===String(o)?' selected':''}>${o}</option>`).join('');
    return `<select class="param-select" id="${id}" onchange="setValue('${groupId}','${param.k}',this.value)">${opts}</select>`;
  }
  if(param.type === 'num') {
    return `<input type="number" class="param-num" id="${id}" value="${cur}" min="${param.min}" max="${param.max}" step="${param.step}" onchange="setValue('${groupId}','${param.k}',Number(this.value))">`;
  }
  return '';
}

function updateParamRow(groupId, paramK) {
  const row = document.getElementById(`row-${groupId}-${paramK}`);
  if(!row) return;
  const group = GROUPS.find(g=>g.id===groupId);
  const param = group.params.find(p=>p.k===paramK);
  row.outerHTML = renderParamRow(groupId, param);
}

function resetParam(groupId, paramK) {
  currentConfig[groupId][paramK] = deepCopy(presetConfig[groupId][paramK]);
  updateParamRow(groupId, paramK);
  updateSidebarDot(groupId);
  updateOverrideCount();
  if(document.getElementById('json-panel').classList.contains('open')) updateJSON();
}

function resetToPreset() {
  currentConfig = deepCopy(presetConfig);
  renderSidebar();
  renderGroup(activeGroup);
  updateOverrideCount();
  if(document.getElementById('json-panel').classList.contains('open')) updateJSON();
}

function updateOverrideCount() {
  const n = totalOverrides();
  const el = document.getElementById('override-count');
  if(n === 0) { el.textContent = '✓ Sem ajustes'; el.className = 'override-count none'; }
  else { el.textContent = `${n} ajuste${n>1?'s':''}`;  el.className = 'override-count'; }
}

// ── JSON ──────────────────────────────────────────────────────────────────────
function buildOutput() {
  const overrides = {};
  GROUPS.forEach(g => {
    g.params.forEach(p => {
      if(isOverridden(g.id, p.k)) {
        if(!overrides[g.id]) overrides[g.id] = {};
        overrides[g.id][p.k] = currentConfig[g.id][p.k];
      }
    });
  });
  return {
    studentId: document.getElementById('student-sel').value,
    profile: currentProfile,
    gameConfig: currentConfig,
    overrides: Object.keys(overrides).length ? overrides : null,
    generatedAt: new Date().toISOString()
  };
}

function syntaxHL(json) {
  return json
    .replace(/("[\w]+")\s*:/g, '<span class="json-key">$1</span>:')
    .replace(/:\s*(".*?")/g, ': <span class="json-str">$1</span>')
    .replace(/:\s*(\d+\.?\d*)/g, ': <span class="json-num">$1</span>')
    .replace(/:\s*(true)/g, ': <span class="json-bool-true">$1</span>')
    .replace(/:\s*(false)/g, ': <span class="json-bool-false">$1</span>')
    .replace(/:\s*(null)/g, ': <span style="color:#aaa">$1</span>');
}

function updateJSON() {
  const out = buildOutput();
  document.getElementById('json-content').innerHTML = syntaxHL(JSON.stringify(out, null, 2));
}

function toggleJSON() {
  const panel = document.getElementById('json-panel');
  panel.classList.toggle('open');
  if(panel.classList.contains('open')) updateJSON();
}

function copyJSON() {
  const text = JSON.stringify(buildOutput(), null, 2);
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✓ Copiado!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadPreset('T1');
</script>
