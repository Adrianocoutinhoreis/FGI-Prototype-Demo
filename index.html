<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FGI - Framework de Jogos Inclusivos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container" style="max-width: 700px;">

        <header class="app-header" style="justify-content: center;">
            <div class="logo-container">
                <span class="logo-emoji" aria-hidden="true">🧩</span>
                <span class="logo-text">FGI — Framework de Jogos Inclusivos</span>
            </div>
        </header>

        <main>
            <h1 class="app-title">Quem está acessando?</h1>
            <p class="app-subtitle" style="margin-bottom: 24px;">Escolha seu perfil de acesso para continuar.</p>

            <div class="grid-2">
                <a href="professor/dashboard.html" class="interactive-card" style="text-decoration: none; padding: 32px 20px;">
                    <div class="card-avatar">👨‍🏫</div>
                    <div class="card-name" style="font-size: 22px;">Professor</div>
                    <div class="card-desc" style="font-size: 16px;">Configure sessões, acompanhe turmas e veja relatórios.</div>
                </a>

                <a href="aluno/login.html" class="interactive-card" style="text-decoration: none; padding: 32px 20px;">
                    <div class="card-avatar">👦</div>
                    <div class="card-name" style="font-size: 22px;">Aluno</div>
                    <div class="card-desc" style="font-size: 16px;">Jogue as atividades liberadas e veja seu progresso.</div>
                </a>
            </div>
        </main>

    </div>

    <script src="js/app.js"></script>
</body>
</html>
